#
# cbindgen config for generating include/ppf_cts.h from the #[no_mangle]
# surface in lib.rs. Header generation is best-effort (see build.rs): the
# staticlib compiles regardless.

language = "C"
header = """
/* ppf_cts.h - C ABI for embedding ZOZO's CUDA contact solver.
 * Generated by cbindgen from ppf-cts-capi; do not edit by hand.
 * License: Apache v2.0 */"""
include_guard = "PPF_CTS_H"
tab_width = 4
pragma_once = false
cpp_compat = true

[export]
prefix = ""
include = ["CtsStatus", "CtsModel", "CtsBarrier", "CtsFrictionMode",
           "CtsGlobalParams", "CtsMaterial", "CtsColliderMaterial",
           "CtsFieldType", "CtsFieldShape", "CtsFieldFalloff", "CtsFieldZDirection",
           "CtsForceField"]

# QualifiedScreamingSnakeCase already qualifies each variant with the enum
# name (Cubic -> CTS_BARRIER_CUBIC), so prefix_with_name is intentionally
# off to avoid a double prefix.
[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false
